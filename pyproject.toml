[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py314"
line-length = 88
include = ["*.py", "*.pyi", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"